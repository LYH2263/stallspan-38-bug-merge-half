services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stallspan
      POSTGRES_PASSWORD: stallspan
      POSTGRES_DB: stallspan
    ports: ["5448:5432"]
    volumes: [stallspan_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stallspan -d stallspan"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://stallspan:stallspan@db:5432/stallspan
      SEED_ON_EMPTY: "true"
    ports: ["9700:9700"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["4700:80"]
    depends_on: [api]
volumes:
  stallspan_pg:
